spring:
  jpa:
    show-sql: true

  datasource:
    url: 'jdbc:postgresql://localhost:5432/nomis_sync?sslmode=prefer'
    username: postgres
    password: postgres

hmpps-auth:
  url: "http://localhost:8090/auth"

sync-api:
  client:
    id: ${SYNC_API_CLIENT_ID:hmpps-prisoner-finance-sync-api-1}
    secret: ${SYNC_CLIENT_SECRET:clientsecret}

general-ledger-api:
  url: ${GENERAL_LEDGER_API_URL:http://localhost:8081}

holds-api:
  url: ${HOLDS_API_URL:http://localhost:8082}

advances-api:
  url: ${ADVANCES_API_URL:http://localhost:8083}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true